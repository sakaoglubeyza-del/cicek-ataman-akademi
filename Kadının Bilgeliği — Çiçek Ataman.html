<style>
  :root{--lilac:#9C89B8; --pink:#F0A6CA; --lilac-light:#EFC3E6; --cream:#F7F2F6; --blue:#B8BEDD; --ink:#2E2A33; --paper:#FFFDFC; box-sizing:border-box;}
  *{box-sizing:inherit; margin:0; padding:0;}
  body{font-family:'Manrope',sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 32px;}
  @media (max-width:640px){.wrap{padding:0 20px;}}
  header{padding:22px 0; border-bottom:1px solid #eee2ec;}
  .logo{font-family:'Cormorant Garamond',serif; font-size:1.3rem; line-height:1.15;}
  .logo span{display:block; font-size:.7em; color:var(--lilac);}
  main{padding:70px 0 100px;}
  .book-detail{display:grid; grid-template-columns:.85fr 1.15fr; gap:64px; align-items:start;}
  @media (max-width:800px){.book-detail{grid-template-columns:1fr; gap:40px;}}
  .cover-wrap img{width:100%; max-width:360px; border-radius:2px; box-shadow:0 26px 50px -18px rgba(46,42,51,.35);}
  .eyebrow-sm{font-size:.8rem; letter-spacing:.05em; color:var(--lilac); margin-bottom:10px;}
  h1{font-family:'Cormorant Garamond',serif; font-size:clamp(2.1rem,4vw,2.8rem); font-weight:500; line-height:1.15;}
  .author{margin-top:8px; color:#7a7385; font-size:.98rem;}
  .subtitle{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.25rem; margin-top:22px; color:#544F5C; line-height:1.5;}
  .block{margin-top:38px; padding-top:28px; border-top:1px solid #eee2ec;}
  .block h2{font-family:'Cormorant Garamond',serif; font-size:1.15rem; font-weight:500; margin-bottom:10px;}
  .block p{color:#7a7385; font-size:.95rem; line-height:1.6;}
  .back{display:inline-block; margin-top:40px; font-size:.88rem; border-bottom:1px solid var(--ink); padding-bottom:2px;}
</style>
